<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>简易群聊/私聊/房间</title>
    <style>
        body{display:flex;height:100vh;margin:0;font:14px/1.4 sans-serif;background:#f5f5f5;}
        aside{width:200px;background:#2c3e50;color:#fff;display:flex;flex-direction:column;}
        aside h3{margin:0;padding:10px;background:#34495e;font-size:14px;text-align:center;}
        .panel{flex:1;overflow-y:auto;padding:4px 0;display:none;}
        .panel.active{display:block;}
        .panel li{padding:6px 10px;cursor:pointer;}
        .panel li:hover{background:#34495e;}
        .panel li.active{background:#1abc9c;}
        section{flex:1;display:flex;flex-direction:column;background:#fff;}
        header{padding:8px 10px;border-bottom:1px solid #ddd;font-size:16px;}
        #chatBody{flex:1;padding:8px;overflow-y:auto;}
        #msgInput{flex:1;padding:6px;border:1px solid #ccc;border-radius:3px;}
        .chat-footer{display:flex;padding:6px;border-top:1px solid #ddd;gap:6px;}
        button{padding:6px 12px;border:none;background:#1abc9c;color:#fff;border-radius:3px;cursor:pointer;}

        /* 防 Chrome 空数组预览 */
        .panel:empty::before,
        .panel li:only-child[style*="color:#999"]::before{
            content:' ';
            display:inline-block;
            width:1px;
            height:1px;
        }
    </style>
</head>
<body>

<aside>
    <h3>模式</h3>
    <div class="panel active" id="panelGroup">
        <li class="active" onclick="switchTarget('group','群聊')">群聊</li>
    </div>
    <div class="panel" id="panelPrivate">
        
    </div>
    <div class="panel" id="panelRoom"></div>
    <div style="border-top:1px solid #34495e;padding:6px;display:flex;gap:4px;">
        <button onclick="createRoom()">新建房间</button>
        <button onclick="joinRoom()">加入房间</button>
    </div>
</aside>

<section>
    <header id="chatTitle">群聊</header>
    <div id="chatBody"></div>
    <div class="chat-footer">
        <input id="msgInput" placeholder="输入消息，回车发送"/>
        <button onclick="sendMsg()">发送</button>
    </div>
</section>

<script>
    /* ---------- 工具 ---------- */
    const $   = id => document.getElementById(id);
    const uuid= () => 'u_' + Math.random().toString(36).slice(2);

    /* ---------- 初始化 ---------- */
    const uid = '${Session["user_key"].account}' + ':' + uuid();
    localStorage.setItem('chat-uid', uid);

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws       = new WebSocket(`${protocol}//127.0.0.1:8092/websocket/`+uid);

    let target    = 'group';
    let activeTab = 'group';

    const panels  = {
        group  : $('panelGroup'),
        private: $('panelPrivate'),
        room   : $('panelRoom')
    };

    /* ---------- 消息入口 ---------- */
    ws.onmessage = e => {
        const obj = JSON.parse(e.data);

        if (obj.type === 'userList') {
            const arr = obj.list || [];
            panels.group.innerHTML   = '<li class="active" onclick="switchTarget(\'group\',\'群聊\')">群聊</li>';
            panels.private.innerHTML = '';
            panels.room.innerHTML    = '';
            if (arr.length === 0) {
                panels.private.innerHTML = '<li style="color:#999;cursor:default">暂无其他用户</li>';
                panels.room.innerHTML    = '<li style="color:#999;cursor:default">暂无房间</li>';
            } else {
                arr.forEach(u => {
                    if (u.uid.startsWith('room_')) {
                        panels.room.innerHTML += `<li onclick="switchTarget('${u.uid}','${u.name}')">${u.name}</li>`;
                    } else if (u.uid !== 'group') {
                        panels.private.innerHTML += `<li onclick="switchTarget('${u.uid}','${u.name}')">${u.name}</li>`;
                    }
                });
            }
        }

        if (['group', 'private', 'room'].includes(obj.type)) {
            appendMsg(obj.from, obj.content, obj.time);
        }
        if (obj.type === 'sys') {
            appendMsg('系统', obj.content, obj.time);
        }
        if (obj.type === 'selfRoom') {
            appendMsg('系统', `已创建房间：${obj.content}`, Date.now());
        }
    };

    ws.onclose = () => appendMsg('系统', '连接已断开', Date.now());
    ws.onerror = e => console.error('ws error', e);

    /* ---------- 发送 ---------- */
    function sendMsg() {
        if (ws.readyState !== WebSocket.OPEN) {
            alert('WebSocket 未连接');
            return;
        }
        const txt = $('msgInput').value.trim();
        if (!txt) return;
        const msg = {
            type: activeTab === 'group' ? 'group' : activeTab === 'private' ? 'private' : 'room',
            to: target,
            content: txt
        };
        ws.send(JSON.stringify(msg));
        appendMsg('我', txt, Date.now());
        $('msgInput').value = '';
    }
    $('msgInput').addEventListener('keyup', e => { if (e.key === 'Enter') sendMsg(); });

    /* ---------- 面板切换 ---------- */
    function switchTarget(uid, name) {
        target = uid;
        $('chatTitle').textContent = name;
        if (uid.startsWith('room_')) activeTab = 'room';
        else if (uid === 'group') activeTab = 'group';
        else activeTab = 'private';
        document.querySelectorAll('li').forEach(li => li.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
    }

    /* ---------- 房间 ---------- */
    function createRoom() {
        const name = prompt('房间名：');
        if (name && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'createRoom', content: name }));
        }
    }
    function joinRoom() {
        const rid = prompt('房间号（room_xxx）：');
        if (rid && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'joinRoom', to: rid }));
        }
    }

    /* ---------- 辅助 ---------- */
    function appendMsg(from, content, time) {
        const t = new Date(time).toLocaleTimeString();
        $('chatBody').insertAdjacentHTML('beforeend',
            `<div><b>[${t}] ${from}:</b> ${content}</div>`);
        $('chatBody').scrollTop = $('chatBody').scrollHeight;
    }

    /* ---------- 面板标签切换 ---------- */
    document.querySelectorAll('.panel').forEach(p =>
        p.addEventListener('click', () => activeTab = p.id.replace('panel', '').toLowerCase())
    );
</script>
</body>
</html>
