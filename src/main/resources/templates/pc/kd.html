<script>
    // ==================== 全局配置 ====================
    var WS_HOST = window.location.hostname;
    var WS_PORT = window.location.port || '8092';
    var WS_PATH = '/websocket/';

    // ==================== 状态管理 ====================
    var currentUser = null;
    var currentFeature = 'online';
    var currentChatType = null;
    var currentTarget = null;
    var currentTargetName = null;
    var ws = null;
    var userList = [];
    var roomList = [];
    var currentRoomInfo = null;
    var isInRoom = false;
    var currentBgTheme = 1;
    var isDarkTheme = false;
    var unreadMessages = {};
    var chatHistory = {};
    var loadingHistory = false;
    var hasMoreHistory = false;
    var currentHistoryPage = 0;
    var historyPageSize = 20;

    var connectionState = 'disconnected';
    var reconnectAttempts = 0;
    var maxReconnectAttempts = 10;
    var reconnectDelay = 1000;
    var heartbeatInterval = null;

    // ==================== 初始化 ====================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('现代聊天室初始化开始');

        checkSavedTheme();

        // 获取当前用户账号
        var userAccount = getCurrentUserAccount();
        var sessionId = generateSessionId();
        var userId = userAccount + ':' + sessionId;

        currentUser = {
            id: userId,
            name: userAccount,
            account: userAccount,
            sessionId: sessionId
        };

        // 保存用户信息到sessionStorage
        sessionStorage.setItem('chat_user_account', userAccount);
        sessionStorage.setItem('chat_session_id', sessionId);
        sessionStorage.setItem('chat_bg_theme', currentBgTheme);
        sessionStorage.setItem('chat_dark_theme', isDarkTheme);

        loadChatHistory();
        updateUserInfo();
        connectWebSocket();
        initEventListeners();
        updateConnectionStatus('connecting');

        console.log('聊天室初始化完成，用户ID:', userId);
    });

    // ==================== 主题和背景管理 ====================
    function checkSavedTheme() {
        var savedBgTheme = sessionStorage.getItem('chat_bg_theme');
        var savedDarkTheme = sessionStorage.getItem('chat_dark_theme');

        if (savedBgTheme) {
            currentBgTheme = parseInt(savedBgTheme);
            changeBgTheme(currentBgTheme);
        }

        if (savedDarkTheme === 'true') {
            isDarkTheme = true;
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('themeIcon').className = 'fas fa-sun';
        }
    }

    function toggleTheme() {
        isDarkTheme = !isDarkTheme;

        if (isDarkTheme) {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('themeIcon').className = 'fas fa-sun';
        } else {
            document.body.removeAttribute('data-theme');
            document.getElementById('themeIcon').className = 'fas fa-moon';
        }

        sessionStorage.setItem('chat_dark_theme', isDarkTheme);
    }

    function changeBgTheme(theme) {
        currentBgTheme = theme;

        for (var i = 1; i <= 6; i++) {
            document.body.classList.remove('bg-theme-' + i);
        }

        document.body.classList.add('bg-theme-' + theme);

        var buttons = document.querySelectorAll('.bg-theme-btn');
        buttons.forEach((btn, index) => {
            if (index + 1 === theme) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        sessionStorage.setItem('chat_bg_theme', theme);
    }

    // ==================== 用户信息管理 ====================
    function getCurrentUserAccount() {
        // 直接从隐藏输入框获取用户账号
        var username = document.getElementById('sessionUserAccount').value;

        if (!username) {
            username = '游客';
            console.warn('未获取到用户账号，使用默认用户: 游客');
        }

        console.log('当前用户:', username);
        return username;
    }

    function generateSessionId() {
        // 如果已有sessionId，使用已有的
        var storedId = sessionStorage.getItem('chat_session_id');
        if (storedId) {
            return storedId;
        }

        // 生成新的sessionId
        var sessionId = Date.now().toString(36) + '-' +
                       Math.random().toString(36).substr(2, 9) + '-' +
                       performance.now().toString(36).substr(2, 5);

        return sessionId;
    }

    function getInitials(name) {
        if (!name || name.length === 0) return 'U';
        return name.charAt(0).toUpperCase();
    }

    function updateUserInfo() {
        document.getElementById('userName').textContent = currentUser.name;
        document.getElementById('userAvatar').textContent = getInitials(currentUser.name);
        document.getElementById('userStatus').innerHTML = '<span class="status-indicator"></span>离线';
    }

    // ==================== 连接管理 ====================
    function updateConnectionStatus(state) {
        connectionState = state;
        var statusElement = document.getElementById('connectionStatus');
        var statusText = '';
        var statusClass = '';
        var statusIcon = '';

        switch(state) {
            case 'connected':
                statusText = '已连接';
                statusClass = 'status-connected';
                statusIcon = 'fa-check-circle';
                document.getElementById('userStatus').innerHTML = '<span class="status-indicator"></span>在线';
                break;
            case 'connecting':
                statusText = '连接中...';
                statusClass = 'status-connecting';
                statusIcon = 'fa-sync-alt fa-spin';
                break;
            case 'disconnected':
                statusText = '已断开';
                statusClass = 'status-disconnected';
                statusIcon = 'fa-times-circle';
                document.getElementById('userStatus').innerHTML = '<span class="status-indicator" style="background: #dc3545;"></span>离线';
                break;
        }

        statusElement.innerHTML = '<i class="fas ' + statusIcon + '"></i><span>' + statusText + '</span>';
        statusElement.className = 'connection-status ' + statusClass;
        statusElement.style.display = 'flex';
    }

    function connectWebSocket() {
        try {
            var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            var wsUrl = protocol + '//' + WS_HOST + (WS_PORT ? ':' + WS_PORT : '') + WS_PATH + encodeURIComponent(currentUser.id);

            console.log('连接WebSocket:', wsUrl);

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }

            ws = new WebSocket(wsUrl);

            ws.onopen = onWebSocketOpen;
            ws.onmessage = onWebSocketMessage;
            ws.onclose = onWebSocketClose;
            ws.onerror = onWebSocketError;
        } catch (error) {
            console.error('连接WebSocket失败:', error);
            updateConnectionStatus('disconnected');
            addSystemMessage('连接失败，请检查服务器地址');
            scheduleReconnect();
        }
    }

    function onWebSocketOpen(event) {
        console.log('WebSocket连接成功');
        updateConnectionStatus('connected');
        addSystemMessage('🎉 已连接到聊天服务器');
        reconnectAttempts = 0;
        reconnectDelay = 1000;

        startHeartbeat();

        sendLoginInfo();

        setTimeout(requestUserList, 500);
        setTimeout(requestRoomList, 1000);
    }

    function onWebSocketMessage(event) {
        console.log("收到消息:", event.data);
        handleWebSocketMessage(event.data);
    }

    function onWebSocketClose(event) {
        console.log('WebSocket连接关闭，代码:', event.code, '原因:', event.reason);
        handleDisconnection(event);
    }

    function onWebSocketError(error) {
        console.error('WebSocket错误:', error);
        updateConnectionStatus('disconnected');
        addSystemMessage('连接错误，正在重连...');
    }

    function sendLoginInfo() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            var msg = {
                type: 'login',
                user: currentUser,
                timestamp: Date.now()
            };
            ws.send(JSON.stringify(msg));
            console.log('发送登录信息:', msg);
        }
    }

    function handleDisconnection(event) {
        updateConnectionStatus('disconnected');
        addSystemMessage('连接已断开');

        clearHeartbeat();

        if (event.code === 1000 || event.code === 1001) {
            console.log('正常关闭，不重连');
            return;
        }

        scheduleReconnect();
    }

    function scheduleReconnect() {
        if (reconnectAttempts >= maxReconnectAttempts) {
            addSystemMessage('重连失败，请刷新页面');
            return;
        }

        reconnectAttempts++;
        reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);

        var delaySeconds = Math.round(reconnectDelay / 1000);
        console.log('第 ' + reconnectAttempts + ' 次尝试重连，等待 ' + delaySeconds + '秒');
        addSystemMessage('连接断开，' + delaySeconds + '秒后尝试重连...');

        setTimeout(function() {
            if (connectionState !== 'connected') {
                console.log('执行重连...');
                updateConnectionStatus('connecting');
                connectWebSocket();
            }
        }, reconnectDelay);
    }

    function startHeartbeat() {
        clearHeartbeat();

        heartbeatInterval = setInterval(function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                var pingMsg = {
                    type: 'ping',
                    timestamp: Date.now()
                };
                ws.send(JSON.stringify(pingMsg));
                console.log('发送心跳');
            }
        }, 25000);
    }

    function clearHeartbeat() {
        if (heartbeatInterval) {
            clearInterval(heartbeatInterval);
            heartbeatInterval = null;
        }
    }

    // ==================== 消息处理 ====================
    function handleWebSocketMessage(data) {
        try {
            var message = JSON.parse(data);
            console.log('解析消息:', message);

            switch(message.type) {
                case 'selfInfo':
                    handleSelfInfo(message);
                    break;
                case 'userList':
                    handleUserList(message);
                    break;
                case 'roomList':
                    handleRoomList(message);
                    break;
                case 'private':
                    handlePrivateMessage(message);
                    break;
                case 'room':
                    handleRoomMessage(message);
                    break;
                case 'sys':
                    handleSystemMessage(message);
                    break;
                case 'userJoin':
                    handleUserJoin(message);
                    break;
                case 'userLeave':
                    handleUserLeave(message);
                    break;
                case 'roomCreated':
                    handleRoomCreated(message);
                    break;
                case 'roomJoined':
                    handleRoomJoined(message);
                    break;
                case 'roomLeft':
                    handleRoomLeft(message);
                    break;
                case 'roomMembers':
                    handleRoomMembers(message);
                    break;
                case 'roomUserJoin':
                    handleRoomUserJoin(message);
                    break;
                case 'roomUserLeave':
                    handleRoomUserLeave(message);
                    break;
                case 'error':
                    handleErrorMessage(message);
                    break;
                case 'pong':
                    console.log('收到pong响应');
                    break;
                case 'file':
                    handleFileMessage(message);
                    break;
                case 'messageAck':
                    handleMessageAck(message);
                    break;
                default:
                    console.log('未知消息类型:', message.type);
            }
        } catch (error) {
            console.error('解析消息失败:', error, '原始数据:', data);
        }
    }

    function handleSelfInfo(message) {
        currentUser.name = message.content || currentUser.name;
        document.getElementById('userName').textContent = currentUser.name;
        document.getElementById('userAvatar').textContent = getInitials(currentUser.name);
    }

    function handleUserList(message) {
        userList = message.list || [];
        updateUserList();
    }

    function handleRoomList(message) {
        roomList = message.list || [];
        updateRoomList();
    }

    function handlePrivateMessage(message) {
        console.log('处理私聊消息:', message);

        // 避免重复显示自己发送的消息
        if (message.from === currentUser.name) {
            console.log('忽略自己发送的消息');
            return;
        }

        var shouldDisplay = false;
        var targetKey = 'private_' + message.from;

        console.log('当前聊天类型:', currentChatType, '当前目标:', currentTarget, '消息发送者:', message.from);

        // 存储消息到历史记录
        saveMessageToHistory(targetKey, {
            from: message.from,
            content: message.content,
            time: message.time || Date.now(),
            type: 'received',
            isFile: message.isFile || false,
            fileName: message.fileName,
            fileData: message.fileData
        });

        // 检查是否应该显示在当前聊天窗口
        if (currentChatType === 'private' && currentTarget === message.from) {
            shouldDisplay = true;
            console.log('应该显示在当前聊天窗口');
        }

        if (shouldDisplay) {
            // 直接显示消息
            addMessageToChat({
                from: message.from,
                content: message.content,
                time: message.time || Date.now(),
                type: 'received',
                isFile: message.isFile || false,
                fileName: message.fileName,
                fileData: message.fileData
            });
        } else {
            // 如果不在当前聊天窗口，增加未读消息计数
            console.log('增加未读消息计数，targetKey:', targetKey);
            increaseUnreadCount(targetKey);
            showMessageNotification(message.from, message.content);
        }
    }

    function handleRoomMessage(message) {
        if (message.from === currentUser.name) {
            return;
        }

        var shouldDisplay = false;
        var targetKey = 'room_' + message.to;

        saveMessageToHistory(targetKey, {
            from: message.from,
            content: message.content,
            time: message.time || Date.now(),
            type: 'received',
            isFile: message.isFile || false,
            fileName: message.fileName,
            fileData: message.fileData
        });

        if (currentChatType === 'room' && currentTarget === message.to) {
            shouldDisplay = true;
        }

        if (shouldDisplay) {
            addMessageToChat({
                from: message.from,
                content: message.content,
                time: message.time || Date.now(),
                type: 'received',
                isFile: message.isFile || false,
                fileName: message.fileName,
                fileData: message.fileData
            });
        } else {
            increaseUnreadCount(targetKey);
            showMessageNotification('房间:' + message.to, message.content);
        }
    }

    function handleSystemMessage(message) {
        addSystemMessage(message.content);
    }

    function handleUserJoin(message) {
        showUserNotification(message.content, 'join');
        setTimeout(requestUserList, 500);
    }

    function handleUserLeave(message) {
        showUserNotification(message.content, 'leave');
        setTimeout(requestUserList, 500);
    }

    function handleRoomCreated(message) {
        addSystemMessage('🏠 房间创建成功: ' + message.content);
        if (message.roomId) {
            setTimeout(function() {
                joinRoom(message.roomId, message.content);
            }, 500);
        }
        setTimeout(requestRoomList, 1000);
    }

    function handleRoomJoined(message) {
        addSystemMessage('✅ 成功加入房间: ' + message.content);
        if (message.members) {
            currentRoomInfo = {
                id: message.roomId,
                name: message.content,
                members: message.members
            };
            if (currentChatType === 'room' && currentTarget === message.roomId) {
                isInRoom = true;
                updateActionButtons();
            }
        }
        setTimeout(requestRoomList, 1000);
    }

    function handleRoomLeft(message) {
        addSystemMessage('👋 已离开房间: ' + message.content);
        if (currentChatType === 'room' && currentTarget === message.roomId) {
            isInRoom = false;
            updateActionButtons();
        }
        currentRoomInfo = null;
    }

    function handleRoomMembers(message) {
        if (currentRoomInfo && currentRoomInfo.id === message.roomId) {
            currentRoomInfo.members = message.members || [];
        }
    }

    function handleRoomUserJoin(message) {
        if (currentChatType === 'room' && currentTarget === message.roomId) {
            addSystemMessage('👋 ' + message.userName + ' 加入了房间');
        }
    }

    function handleRoomUserLeave(message) {
        if (currentChatType === 'room' && currentTarget === message.roomId) {
            addSystemMessage('👋 ' + message.userName + ' 离开了房间');
        }
    }

    function handleErrorMessage(message) {
        addSystemMessage('❌ 错误: ' + message.content);
    }

    function handleFileMessage(message) {
        var shouldDisplay = false;
        var targetKey = '';

        if (currentChatType === 'private') {
            targetKey = 'private_' + (message.from === currentUser.name ? message.to : message.from);
            if (currentTarget === message.from || currentTarget === message.to) {
                shouldDisplay = true;
            }
        } else if (currentChatType === 'room') {
            targetKey = 'room_' + message.to;
            if (currentTarget === message.to) {
                shouldDisplay = true;
            }
        }

        saveMessageToHistory(targetKey, {
            from: message.from,
            content: '[文件]',
            time: message.time || Date.now(),
            type: message.from === currentUser.name ? 'sent' : 'received',
            isFile: true,
            fileName: message.fileName,
            fileData: message.fileData,
            fileType: message.fileType
        });

        if (shouldDisplay) {
            displayFileMessage(message);
        } else {
            increaseUnreadCount(targetKey);
            showMessageNotification(message.from, '发送了一个文件: ' + message.fileName);
        }
    }

    function handleMessageAck(message) {
        console.log('消息已送达:', message);
    }

    // ==================== 数据请求 ====================
    function requestUserList() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            var msg = {
                type: 'getUserList',
                timestamp: Date.now()
            };
            ws.send(JSON.stringify(msg));
        }
    }

    function requestRoomList() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            var msg = {
                type: 'getRoomList',
                timestamp: Date.now()
            };
            ws.send(JSON.stringify(msg));
        }
    }

    // ==================== UI更新函数 ====================
    function switchFeature(feature) {
        currentFeature = feature;

        var buttons = document.querySelectorAll('.feature-tab');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        document.getElementById('onlineList').classList.remove('active');
        document.getElementById('roomList').classList.remove('active');

        if (feature === 'online') {
            document.getElementById('onlineList').classList.add('active');
            document.getElementById('roomCreate').classList.remove('active');
        } else if (feature === 'rooms') {
            document.getElementById('roomList').classList.add('active');
            document.getElementById('roomCreate').classList.add('active');
            requestRoomList();
        }
    }

    function updateUserList() {
        var userListElement = document.getElementById('userList');
        var onlineCountElement = document.getElementById('onlineCount');
        var searchTerm = document.getElementById('searchInput').value.toLowerCase();

        var onlineUsers = userList.filter(function(user) {
            return user.uid !== currentUser.id &&
                   (searchTerm === '' || user.name.toLowerCase().includes(searchTerm));
        });

        var onlineCount = onlineUsers.length;
        onlineCountElement.textContent = onlineCount;

        userListElement.innerHTML = '';

        if (onlineUsers.length > 0) {
            onlineUsers.forEach(function(user) {
                var userItem = document.createElement('div');
                userItem.className = 'user-item' + (currentTarget === user.name && currentChatType === 'private' ? ' active' : '');
                userItem.innerHTML = '<div class="avatar" style="background: #' + generateColor(user.uid) + ';">' +
                                    getInitials(user.name) + '</div>' +
                                    '<div class="user-name">' + user.name + '</div>';

                var unreadCount = getUnreadCount('private_' + user.name);
                if (unreadCount > 0) {
                    var notification = document.createElement('div');
                    notification.className = 'message-notification';
                    notification.textContent = unreadCount > 99 ? '99+' : unreadCount;
                    userItem.appendChild(notification);
                }

                userItem.onclick = (function(userName) {
                    return function() {
                        selectChatTarget(userName, userName, 'private');
                    };
                })(user.name);
                userListElement.appendChild(userItem);
            });
        } else {
            var emptyState = document.createElement('div');
            emptyState.className = 'empty-state';
            emptyState.style.padding = '20px 0';
            emptyState.innerHTML = searchTerm ? '<p>未找到匹配的用户</p>' : '<p>暂无其他在线用户</p>';
            userListElement.appendChild(emptyState);
        }
    }

    function updateRoomList() {
        var roomsContainer = document.getElementById('roomsContainer');
        var roomCountElement = document.getElementById('roomCount');
        var searchTerm = document.getElementById('searchInput').value.toLowerCase();

        var filteredRooms = roomList.filter(function(room) {
            return searchTerm === '' || room.name.toLowerCase().includes(searchTerm);
        });

        roomCountElement.textContent = filteredRooms.length;

        roomsContainer.innerHTML = '';

        if (filteredRooms.length === 0) {
            roomsContainer.innerHTML = '<div class="empty-state"><i class="fas fa-door-closed"></i><h4>暂无聊天房间</h4><p>' + (searchTerm ? '未找到匹配的房间' : '点击上方"创建"按钮创建房间') + '</p></div>';
            return;
        }

        filteredRooms.forEach(function(room) {
            var roomItem = document.createElement('div');
            roomItem.className = 'room-item' + (currentTarget === room.id && currentChatType === 'room' ? ' active' : '');
            roomItem.innerHTML = '<div class="avatar" style="background: #' + generateColor(room.id) + ';">房</div>' +
                                '<div class="room-name">' + room.name + '</div>' +
                                '<div class="room-member-count">' + (room.memberCount || 0) + '人</div>';

            var unreadCount = getUnreadCount('room_' + room.id);
            if (unreadCount > 0) {
                var notification = document.createElement('div');
                notification.className = 'message-notification';
                notification.textContent = unreadCount > 99 ? '99+' : unreadCount;
                roomItem.appendChild(notification);
            }

            roomItem.onclick = (function(roomId, roomName) {
                return function() {
                    selectChatTarget(roomId, roomName, 'room');
                };
            })(room.id, room.name);
            roomsContainer.appendChild(roomItem);
        });
    }

    function handleSearch(event) {
        if (currentFeature === 'online') {
            updateUserList();
        } else {
            updateRoomList();
        }
    }

    function selectChatTarget(targetId, targetName, type) {
        console.log('选择聊天目标:', targetId, targetName, type);

        var targetKey = (type === 'private' ? 'private_' : 'room_') + targetId;
        clearUnreadCount(targetKey);

        currentTarget = targetId;
        currentTargetName = targetName;
        currentChatType = type;

        isInRoom = false;
        if (type === 'room') {
            var room = roomList.find(r => r.id === targetId);
            if (room) {
                isInRoom = room.members && room.members.includes(currentUser.id);
            }
        }

        updateSelectionUI();
        updateChatHeader();
        updateActionButtons();
        updateInputState();

        document.getElementById('emptyChatState').style.display = 'none';
        document.getElementById('messageContainer').style.display = 'block';

        clearCurrentChat();
        loadHistoryMessages();

        if (type === 'private' || (type === 'room' && isInRoom)) {
            document.getElementById('messageInput').focus();
        }

        console.log('选择聊天目标完成:', targetId, targetName, type, 'isInRoom:', isInRoom);
    }

    function clearCurrentChat() {
        document.getElementById('messageContainer').innerHTML = '';
        currentHistoryPage = 0;
        hasMoreHistory = false;
    }

    function loadHistoryMessages() {
        var targetKey = (currentChatType === 'private' ? 'private_' : 'room_') + currentTarget;
        var history = chatHistory[targetKey] || [];

        console.log('加载历史消息，targetKey:', targetKey, '历史消息数量:', history.length);

        if (history.length === 0) {
            addSystemMessage('🚀 开始聊天...');
            return;
        }

        var startIndex = Math.max(0, history.length - historyPageSize);
        for (var i = startIndex; i < history.length; i++) {
            addMessageToChat(history[i], true);
        }

        hasMoreHistory = startIndex > 0;
        scrollToBottom();
    }

    function loadMoreHistory() {
        if (loadingHistory || !hasMoreHistory) return;

        loadingHistory = true;
        document.getElementById('loadingMore').style.display = 'block';

        var targetKey = (currentChatType === 'private' ? 'private_' : 'room_') + currentTarget;
        var history = chatHistory[targetKey] || [];

        currentHistoryPage++;
        var startIndex = Math.max(0, history.length - (currentHistoryPage + 1) * historyPageSize);
        var endIndex = Math.max(0, history.length - currentHistoryPage * historyPageSize);

        if (startIndex <= 0) {
            hasMoreHistory = false;
        }

        setTimeout(function() {
            var container = document.getElementById('chatBody');
            var oldHeight = container.scrollHeight;

            for (var i = startIndex; i < endIndex; i++) {
                addMessageToChat(history[i], true, true);
            }

            var newHeight = container.scrollHeight;
            container.scrollTop = newHeight - oldHeight;

            loadingHistory = false;
            document.getElementById('loadingMore').style.display = 'none';
        }, 300);
    }

    function updateSelectionUI() {
        var userItems = document.querySelectorAll('.user-item');
        var roomItems = document.querySelectorAll('.room-item');

        userItems.forEach(item => item.classList.remove('active'));
        roomItems.forEach(item => item.classList.remove('active'));

        if (currentChatType === 'private') {
            var userItem = document.querySelector('.user-item[onclick*="' + currentTarget + '"]');
            if (userItem) userItem.classList.add('active');
        } else if (currentChatType === 'room') {
            var roomItem = document.querySelector('.room-item[onclick*="' + currentTarget + '"]');
            if (roomItem) roomItem.classList.add('active');
        }
    }

    function updateChatHeader() {
        var chatAvatar = document.getElementById('chatAvatar');
        var chatTitle = document.getElementById('chatTitle');
        var chatTypeBadge = document.getElementById('chatTypeBadge');
        var chatSubtitle = document.getElementById('chatSubtitle');

        switch(currentChatType) {
            case 'private':
                chatAvatar.textContent = getInitials(currentTargetName);
                chatAvatar.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';
                chatTitle.innerHTML = currentTargetName + ' <span class="chat-type-badge badge-private">私聊</span>';
                chatSubtitle.textContent = '私人对话 💬';
                break;

            case 'room':
                chatAvatar.textContent = '房';
                chatAvatar.style.background = 'linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%)';
                chatTitle.innerHTML = currentTargetName + ' <span class="chat-type-badge badge-room">房间</span>';
                chatSubtitle.textContent = isInRoom ? '已加入房间 👥' : '点击"加入房间"按钮开始聊天';
                break;

            default:
                chatAvatar.textContent = '?';
                chatAvatar.style.background = 'linear-gradient(135deg, #6c757d 0%, #495057 100%)';
                chatTitle.innerHTML = '选择聊天对象 <span class="chat-type-badge">等待选择</span>';
                chatSubtitle.textContent = '点击左侧用户或房间开始聊天';
                break;
        }
    }

    function updateActionButtons() {
        var actionButtons = document.getElementById('actionButtons');
        var joinRoomBtn = document.getElementById('joinRoomBtn');
        var leaveRoomBtn = document.getElementById('leaveRoomBtn');

        if (currentChatType === 'room') {
            actionButtons.style.display = 'flex';
            if (isInRoom) {
                joinRoomBtn.style.display = 'none';
                leaveRoomBtn.style.display = 'block';
            } else {
                joinRoomBtn.style.display = 'block';
                leaveRoomBtn.style.display = 'none';
            }
        } else {
            actionButtons.style.display = 'none';
        }
    }

    function updateInputState() {
        var messageInput = document.getElementById('messageInput');
        var sendBtn = document.getElementById('sendBtn');

        if (currentChatType === 'private') {
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.placeholder = '输入消息... 💬';
        } else if (currentChatType === 'room') {
            if (isInRoom) {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.placeholder = '在房间中输入消息... 👥';
            } else {
                messageInput.disabled = true;
                sendBtn.disabled = true;
                messageInput.placeholder = '请先加入房间';
            }
        } else {
            messageInput.disabled = true;
            sendBtn.disabled = true;
            messageInput.placeholder = '选择聊天对象...';
        }
    }

    // ==================== 房间操作 ====================
    function createRoom() {
        var roomNameInput = document.getElementById('roomNameInput');
        var roomName = roomNameInput.value.trim();

        if (!roomName) {
            showNotification('请输入房间名称', 'error');
            return;
        }

        if (!ws || ws.readyState !== WebSocket.OPEN) {
            showNotification('连接未就绪', 'error');
            return;
        }

        var message = {
            type: 'createRoom',
            content: roomName,
            timestamp: Date.now()
        };

        ws.send(JSON.stringify(message));
        roomNameInput.value = '';
        addSystemMessage('🏗️ 正在创建房间: ' + roomName);
    }

    function joinRoom(roomId, roomName) {
        var targetId = roomId || currentTarget;
        var targetName = roomName || currentTargetName;

        if (!targetId) {
            return;
        }

        if (!ws || ws.readyState !== WebSocket.OPEN) {
            showNotification('连接未就绪', 'error');
            return;
        }

        var message = {
            type: 'joinRoom',
            to: targetId,
            timestamp: Date.now()
        };

        ws.send(JSON.stringify(message));
        addSystemMessage('🚪 正在加入房间...');
    }

    function leaveRoom() {
        if (currentChatType !== 'room' || !currentTarget || !isInRoom) {
            return;
        }

        if (!ws || ws.readyState !== WebSocket.OPEN) {
            showNotification('连接未就绪', 'error');
            return;
        }

        if (!confirm('确定要离开房间吗？')) {
            return;
        }

        var message = {
            type: 'leaveRoom',
            to: currentTarget,
            timestamp: Date.now()
        };

        ws.send(JSON.stringify(message));
        addSystemMessage('🚪 正在离开房间...');
    }

    function clearChat() {
        if (!confirm('确定要清空当前聊天记录吗？')) {
            return;
        }
        document.getElementById('messageContainer').innerHTML = '';
        addSystemMessage('🗑️ 聊天记录已清空');

        var targetKey = (currentChatType === 'private' ? 'private_' : 'room_') + currentTarget;
        if (chatHistory[targetKey]) {
            chatHistory[targetKey] = [];
            saveChatHistory();
        }
    }

    // ==================== 消息发送和显示 ====================
    function sendMessage() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            addSystemMessage('连接未就绪，无法发送消息');
            return;
        }

        var input = document.getElementById('messageInput');
        var content = input.value.trim();

        if (!content) {
            return;
        }

        if (!currentTarget || !currentChatType) {
            showNotification('请先选择聊天对象', 'error');
            return;
        }

        var message = {
            type: currentChatType,
            to: currentTarget,
            content: content,
            timestamp: Date.now()
        };

        ws.send(JSON.stringify(message));
        console.log('发送消息:', message);

        var targetKey = (currentChatType === 'private' ? 'private_' : 'room_') + currentTarget;
        saveMessageToHistory(targetKey, {
            from: currentUser.name,
            content: content,
            time: Date.now(),
            type: 'sent'
        });

        addMessageToChat({
            from: '我',
            content: content,
            time: Date.now(),
            type: 'sent'
        });

        input.value = '';
        autoResizeTextarea(input);
    }

    function addMessageToChat(msg, isHistory, prepend) {
        var container = document.getElementById('messageContainer');

        if (isHistory && prepend) {
            addMessageToTop(msg);
            return;
        }

        addMessage(msg);
    }

    function addMessage(msg) {
        var container = document.getElementById('messageContainer');

        addDateDivider(msg.time);

        var messageElement = document.createElement('div');
        var messageClass = 'message ' + (msg.type === 'sent' ? 'sent' : 'received');
        messageElement.className = messageClass;

        var time = new Date(msg.time).toLocaleTimeString('zh-CN', {
            hour: '2-digit',
            minute: '2-digit'
        });

        if (msg.isFile) {
            var fileHtml = '';
            var isImage = msg.fileType && msg.fileType.startsWith('image/');

            if (isImage) {
                fileHtml = '<div class="file-message">' +
                    '<i class="fas fa-image"></i>' +
                    '<div>' +
                    '<a href="#" onclick="openImage(\'' + escapeHtml(msg.fileData) + '\', \'' + escapeHtml(msg.fileName) + '\'); return false;" style="display: block;">' + escapeHtml(msg.fileName) + '</a>' +
                    '<img src="' + msg.fileData + '" alt="图片" style="max-width: 200px; max-height: 200px; border-radius: 8px; margin-top: 8px; cursor: pointer;" onclick="openImage(\'' + escapeHtml(msg.fileData) + '\', \'' + escapeHtml(msg.fileName) + '\')">' +
                    '</div>' +
                    '</div>';
            } else {
                fileHtml = '<div class="file-message">' +
                    '<i class="fas fa-file"></i>' +
                    '<div>' +
                    '<a href="#" onclick="downloadFile(\'' + escapeHtml(msg.fileData) + '\', \'' + escapeHtml(msg.fileName) + '\'); return false;">' + escapeHtml(msg.fileName) + '</a>' +
                    '<small style="display: block; color: var(--text-secondary);">点击下载</small>' +
                    '</div>' +
                    '</div>';
            }

            if (msg.type === 'sent') {
                messageElement.innerHTML = '<div class="message-content">' + fileHtml + '</div><div class="message-time">' + time + '</div>';
            } else {
                messageElement.innerHTML = '<div class="message-sender">' + escapeHtml(msg.from) + '</div><div class="message-content">' + fileHtml + '</div><div class="message-time">' + time + '</div>';
            }
        } else {
            if (msg.type === 'sent') {
                messageElement.innerHTML = '<div class="message-content">' + escapeHtml(msg.content) + '</div><div class="message-time">' + time + '</div>';
            } else {
                messageElement.innerHTML = '<div class="message-sender">' + escapeHtml(msg.from) + '</div><div class="message-content">' + escapeHtml(msg.content) + '</div><div class="message-time">' + time + '</div>';
            }
        }

        container.appendChild(messageElement);

        if (!msg.isHistory) {
            scrollToBottom();
        }
    }

    function addMessageToTop(msg) {
        var container = document.getElementById('messageContainer');

        addDateDivider(msg.time, true);

        var messageElement = document.createElement('div');
        var messageClass = 'message ' + (msg.type === 'sent' ? 'sent' : 'received');
        messageElement.className = messageClass;

        var time = new Date(msg.time).toLocaleTimeString('zh-CN', {
            hour: '2-digit',
            minute: '2-digit'
        });

        if (msg.type === 'sent') {
            messageElement.innerHTML = '<div class="message-content">' + escapeHtml(msg.content) + '</div><div class="message-time">' + time + '</div>';
        } else {
            messageElement.innerHTML = '<div class="message-sender">' + escapeHtml(msg.from) + '</div><div class="message-content">' + escapeHtml(msg.content) + '</div><div class="message-time">' + time + '</div>';
        }

        container.insertBefore(messageElement, container.firstChild);
    }

    function addDateDivider(timestamp, isTop) {
        var container = document.getElementById('messageContainer');
        var date = new Date(timestamp).toLocaleDateString('zh-CN');
        var lastDivider = container.querySelector('.message-date-divider:last-child');

        if (!lastDivider || lastDivider.getAttribute('data-date') !== date) {
            var divider = document.createElement('div');
            divider.className = 'message-date-divider';
            divider.setAttribute('data-date', date);
            divider.innerHTML = '<span>' + date + '</span>';

            if (isTop) {
                container.insertBefore(divider, container.firstChild);
            } else {
                container.appendChild(divider);
            }
        }
    }

    function addSystemMessage(content) {
        var container = document.getElementById('messageContainer');
        var messageElement = document.createElement('div');
        messageElement.className = 'message system';
        messageElement.textContent = content;
        container.appendChild(messageElement);
        scrollToBottom();
    }

    function scrollToBottom() {
        var chatBody = document.getElementById('chatBody');
        setTimeout(function() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }, 100);
    }

    function scrollToNewMessage() {
        var chatBody = document.getElementById('chatBody');
        chatBody.scrollTop = chatBody.scrollHeight;
        document.getElementById('newMessageNotification').style.display = 'none';
    }

    // ==================== 历史消息存储 ====================
    function loadChatHistory() {
        var savedHistory = localStorage.getItem('chat_history_' + currentUser.id);
        if (savedHistory) {
            try {
                chatHistory = JSON.parse(savedHistory);
            } catch (e) {
                console.error('加载历史消息失败:', e);
                chatHistory = {};
            }
        } else {
            chatHistory = {};
        }
    }

    function saveChatHistory() {
        try {
            localStorage.setItem('chat_history_' + currentUser.id, JSON.stringify(chatHistory));
        } catch (e) {
            console.error('保存历史消息失败:', e);
        }
    }

    function saveMessageToHistory(targetKey, message) {
        if (!chatHistory[targetKey]) {
            chatHistory[targetKey] = [];
        }

        chatHistory[targetKey].push({
            ...message,
            id: generateMessageId()
        });

        if (chatHistory[targetKey].length > 1000) {
            chatHistory[targetKey] = chatHistory[targetKey].slice(-1000);
        }

        saveChatHistory();
    }

    function generateMessageId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    // ==================== 未读消息管理 ====================
    function getUnreadCount(targetKey) {
        return unreadMessages[targetKey] || 0;
    }

    function increaseUnreadCount(targetKey) {
        if (!unreadMessages[targetKey]) {
            unreadMessages[targetKey] = 0;
        }
        unreadMessages[targetKey]++;

        updateUnreadUI();
    }

    function clearUnreadCount(targetKey) {
        unreadMessages[targetKey] = 0;
        updateUnreadUI();

        if (targetKey.startsWith('private_')) {
            updateUserList();
        } else {
            updateRoomList();
        }
    }

    function updateUnreadUI() {
        var totalUnread = Object.values(unreadMessages).reduce((sum, count) => sum + count, 0);

        if (totalUnread > 0) {
            document.title = '(' + totalUnread + ') 现代聊天室';
            document.getElementById('newMessageCount').textContent = totalUnread;
            document.getElementById('newMessageNotification').style.display = 'flex';
        } else {
            document.title = '现代聊天室';
            document.getElementById('newMessageNotification').style.display = 'none';
        }
    }

    // ==================== 消息通知 ====================
    function showMessageNotification(sender, content) {
        if (document.hidden) {
            sendBrowserNotification(sender, content);
        }

        var notification = document.createElement('div');
        notification.className = 'user-notification notification-message';
        notification.innerHTML = '<i class="fas fa-comment-alt"></i> <strong>' + escapeHtml(sender) + ':</strong> ' +
                               (content.length > 30 ? escapeHtml(content.substring(0, 30)) + '...' : escapeHtml(content));

        document.body.appendChild(notification);

        setTimeout(function() {
            notification.style.animation = 'slideOut 0.3s ease-out';
            setTimeout(function() {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 300);
        }, 3000);
    }

    function sendBrowserNotification(sender, content) {
        if (!("Notification" in window)) {
            return;
        }

        if (Notification.permission === "granted") {
            new Notification(sender + ' 发来消息', {
                body: content,
                icon: '/favicon.ico'
            });
        } else if (Notification.permission !== "denied") {
            Notification.requestPermission().then(function (permission) {
                if (permission === "granted") {
                    new Notification(sender + ' 发来消息', {
                        body: content,
                        icon: '/favicon.ico'
                    });
                }
            });
        }
    }

    function showUserNotification(userName, type) {
        if (!userName) return;

        var notification = document.createElement('div');
        var icon = type === 'join' ? 'fa-user-plus' : 'fa-user-minus';
        var className = type === 'join' ? 'notification-join' : 'notification-leave';
        var text = type === 'join' ? userName + ' 加入了聊天室' : userName + ' 离开了聊天室';

        notification.className = 'user-notification ' + className;
        notification.innerHTML = '<i class="fas ' + icon + '"></i> ' + text;

        document.body.appendChild(notification);

        setTimeout(function() {
            notification.style.animation = 'slideOut 0.3s ease-out';
            setTimeout(function() {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 300);
        }, 3000);
    }

    function showNotification(message, type) {
        var notification = document.createElement('div');
        var className = type === 'error' ? 'notification-leave' : 'notification-join';

        notification.className = 'user-notification ' + className;
        notification.innerHTML = '<i class="fas fa-info-circle"></i> ' + message;

        document.body.appendChild(notification);

        setTimeout(function() {
            notification.style.animation = 'slideOut 0.3s ease-out';
            setTimeout(function() {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 300);
        }, 2000);
    }

    // ==================== 工具函数 ====================
    function generateColor(str) {
        if (!str) return '4a6bff';
        var hash = 0;
        for (var i = 0; i < str.length; i++) {
            hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        var color = (hash & 0x00FFFFFF).toString(16).toUpperCase();
        return '00000'.substring(0, 6 - color.length) + color;
    }

    function escapeHtml(text) {
        if (!text) return '';
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function autoResizeTextarea(textarea) {
        textarea.style.height = 'auto';
        var newHeight = Math.min(textarea.scrollHeight, 120);
        textarea.style.height = newHeight + 'px';
    }

    // ==================== 文件处理 ====================
    function toggleFileUpload() {
        var fileUploadArea = document.getElementById('fileUploadArea');
        if (fileUploadArea.style.display === 'none' || !fileUploadArea.style.display) {
            fileUploadArea.style.display = 'block';
            document.getElementById('fileInput').click();
        } else {
            fileUploadArea.style.display = 'none';
        }
    }

    function handleDragOver(event) {
        event.preventDefault();
        event.currentTarget.classList.add('dragover');
    }

    function handleDragLeave(event) {
        event.currentTarget.classList.remove('dragover');
    }

    function handleFileDrop(event) {
        event.preventDefault();
        event.currentTarget.classList.remove('dragover');

        var files = event.dataTransfer.files;
        if (files.length > 0) {
            processFiles(files);
        }
    }

    function handleFileSelect(event) {
        var files = event.target.files;
        if (files.length > 0) {
            processFiles(files);
        }
    }

    function processFiles(files) {
        for (var i = 0; i < files.length; i++) {
            var file = files[i];
            if (file.size > 10 * 1024 * 1024) {
                showNotification('文件大小不能超过10MB', 'error');
                continue;
            }

            var reader = new FileReader();
            reader.onload = function(e) {
                sendFile(file.name, file.type, e.target.result);
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('fileUploadArea').style.display = 'none';
    }

    function sendFile(fileName, fileType, fileData) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            showNotification('连接未就绪，无法发送文件', 'error');
            return;
        }

        if (!currentTarget || !currentChatType) {
            showNotification('请先选择聊天对象', 'error');
            return;
        }

        var message = {
            type: 'file',
            to: currentTarget,
            content: '[文件]',
            fileName: fileName,
            fileType: fileType,
            fileData: fileData,
            timestamp: Date.now()
        };

        ws.send(JSON.stringify(message));
        console.log('发送文件:', message);

        var targetKey = (currentChatType === 'private' ? 'private_' : 'room_') + currentTarget;
        saveMessageToHistory(targetKey, {
            from: currentUser.name,
            content: '[文件]',
            time: Date.now(),
            type: 'sent',
            isFile: true,
            fileName: fileName,
            fileData: fileData,
            fileType: fileType
        });

        addMessageToChat({
            from: currentUser.name,
            content: '[文件]',
            time: Date.now(),
            type: 'sent',
            isFile: true,
            fileName: fileName,
            fileData: fileData,
            fileType: fileType
        });
    }

    function displayFileMessage(message) {
        var fileHtml = '';
        var isImage = message.fileType && message.fileType.startsWith('image/');

        if (isImage) {
            fileHtml = '<div class="file-message">' +
                '<i class="fas fa-image"></i>' +
                '<div>' +
                '<a href="#" onclick="openImage(\'' + escapeHtml(message.fileData) + '\', \'' + escapeHtml(message.fileName) + '\'); return false;" style="display: block;">' + escapeHtml(message.fileName) + '</a>' +
                '<img src="' + message.fileData + '" alt="图片" style="max-width: 200px; max-height: 200px; border-radius: 8px; margin-top: 8px; cursor: pointer;" onclick="openImage(\'' + escapeHtml(message.fileData) + '\', \'' + escapeHtml(message.fileName) + '\')">' +
                '</div>' +
                '</div>';
        } else {
            fileHtml = '<div class="file-message">' +
                '<i class="fas fa-file"></i>' +
                '<div>' +
                '<a href="#" onclick="downloadFile(\'' + escapeHtml(message.fileData) + '\', \'' + escapeHtml(message.fileName) + '\'); return false;">' + escapeHtml(message.fileName) + '</a>' +
                '<small style="display: block; color: var(--text-secondary);">点击下载</small>' +
                '</div>' +
                '</div>';
        }

        addMessageToChat({
            from: message.from,
            content: fileHtml,
            time: message.timestamp || Date.now(),
            type: message.from === currentUser.name ? 'sent' : 'received',
            isHtml: true
        });
    }

    function openImage(fileData, fileName) {
        var win = window.open();
        win.document.write('<html><head><title>' + fileName + '</title></head><body style="margin:0;padding:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;">' +
            '<img src="' + fileData + '" style="max-width:100%;max-height:100%;" alt="' + fileName + '">' +
            '</body></html>');
    }

    function downloadFile(fileData, fileName) {
        var link = document.createElement('a');
        link.href = fileData;
        link.download = fileName;
        link.click();
    }

    // ==================== 表情功能 ====================
    function insertEmoji() {
        var emojiPicker = document.getElementById('emojiPicker');
        if (emojiPicker.style.display === 'none' || !emojiPicker.style.display) {
            emojiPicker.style.display = 'block';
            setTimeout(function() {
                document.addEventListener('click', closeEmojiPicker);
            }, 100);
        } else {
            emojiPicker.style.display = 'none';
            document.removeEventListener('click', closeEmojiPicker);
        }
    }

    function closeEmojiPicker(event) {
        var emojiPicker = document.getElementById('emojiPicker');
        if (!emojiPicker.contains(event.target) && !event.target.closest('.action-btn')) {
            emojiPicker.style.display = 'none';
            document.removeEventListener('click', closeEmojiPicker);
        }
    }

    function insertEmojiChar(emoji) {
        var messageInput = document.getElementById('messageInput');
        var cursorPos = messageInput.selectionStart;
        var textBefore = messageInput.value.substring(0, cursorPos);
        var textAfter = messageInput.value.substring(cursorPos);

        messageInput.value = textBefore + emoji + textAfter;
        messageInput.selectionStart = messageInput.selectionEnd = cursorPos + emoji.length;
        messageInput.focus();

        document.getElementById('emojiPicker').style.display = 'none';
        document.removeEventListener('click', closeEmojiPicker);
        autoResizeTextarea(messageInput);
    }

    // ==================== 事件监听 ====================
    function initEventListeners() {
        var textarea = document.getElementById('messageInput');
        textarea.addEventListener('input', function() {
            autoResizeTextarea(this);
        });

        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                document.title = '现代聊天室';

                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    if (connectionState !== 'connected' && reconnectAttempts < maxReconnectAttempts) {
                        updateConnectionStatus('connecting');
                        connectWebSocket();
                    }
                } else {
                    requestUserList();
                    requestRoomList();
                }
            }
        });

        window.addEventListener('beforeunload', function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                var closeMsg = {
                    type: 'disconnect',
                    from: currentUser.name,
                    timestamp: Date.now()
                };
                ws.send(JSON.stringify(closeMsg));
                ws.close();
            }
            clearHeartbeat();
        });

        if ("Notification" in window && Notification.permission === "default") {
            Notification.requestPermission();
        }
    }

    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
        autoResizeTextarea(event.target);
    }

    function handleRoomInputKeyDown(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            createRoom();
        }
    }

    function handleChatScroll() {
        var chatBody = document.getElementById('chatBody');
        if (chatBody.scrollTop === 0 && hasMoreHistory && !loadingHistory) {
            loadMoreHistory();
        }
    }

    // ==================== 调试函数 ====================
    window.reconnect = function() {
        if (connectionState === 'connected') {
            alert('已经连接了');
            return;
        }
        updateConnectionStatus('connecting');
        reconnectAttempts = 0;
        connectWebSocket();
    };

    window.disconnect = function() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.close();
        }
    };

    window.testMessage = function() {
        if (!currentTarget || !currentChatType) {
            alert('请先选择聊天对象');
            return;
        }
        var testMsg = {
            type: currentChatType,
            to: currentTarget,
            content: '测试消息 ' + new Date().toLocaleTimeString(),
            timestamp: Date.now()
        };
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(testMsg));
        }
    };

    window.clearAllHistory = function() {
        if (confirm('确定要清空所有聊天记录吗？此操作不可恢复！')) {
            chatHistory = {};
            localStorage.removeItem('chat_history_' + currentUser.id);
            document.getElementById('messageContainer').innerHTML = '';
            addSystemMessage('🗑️ 所有聊天记录已清空');
        }
    };
</script>
</body>
</html>
